name: Bootstrap frontend

# Run once from the Actions tab: generates the Angular app with scripts/setup-frontend.sh
# and commits it to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: ./scripts/setup-frontend.sh
      - name: Commit generated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "chore(frontend): generate Angular app via setup script"
          git push
