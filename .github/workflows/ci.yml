name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, static analysis and tests
        run: |
          set -o pipefail
          ./gradlew ktlintCheck detekt test --no-daemon --continue 2>&1 | tee gradle.log
      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^> |FAILED|\.kt:[0-9]+|Exception|Could not" gradle.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Check frontend exists
        id: check
        working-directory: .
        run: |
          if [ -f frontend/angular.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No Angular app yet; run the 'Bootstrap frontend' workflow."; fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        run: npm ci
      - if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - if: steps.check.outputs.exists == 'true'
        run: npm test -- --watch=false
      - if: steps.check.outputs.exists == 'true'
        run: npm run build
