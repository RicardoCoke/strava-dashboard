<header class="page-header">
  <h1>Running</h1>
  <app-weekly-summary-bell />
</header>
<app-sync-banner [state]="sync.bannerState()" />
@if (sync.status()?.status === 'syncing') {
  <app-ring-spinner class="sync-spinner" />
}

@switch (state().kind) {
  @case ('loading') {
    <div class="loading" role="status" aria-live="polite">
      <app-ring-spinner />
      <p class="loading-text">Loading your runs…</p>
    </div>
  }
  @case ('error') {
    <div class="card status-card" role="alert">
      <p>Couldn't load your dashboard.</p>
      <button type="button" class="retry" (click)="retry()">Retry</button>
    </div>
  }
  @case ('loaded') {
    @if (data(); as data) {
      @if (empty()) {
        <div class="card status-card">
          <p class="empty">No runs in the last 5 months</p>
        </div>
      } @else {
        <app-headline-tiles [dashboard]="data" />
        <div class="cards">
          <app-weekly-distance-chart [weekly]="data.weeklyDistance" />
          <app-heart-rate-trend-chart
            [trend]="data.heartRateTrend"
            [selectedTypeKey]="selectedHrTypeKey()"
            (typeSelected)="selectedHrTypeKey.set($event)"
          />
          <app-long-run-drift-section />
          <app-efficiency-factor-section />
          <app-workout-pace-comparison-chart
            [comparison]="data.workoutPaceComparison"
            [selectedTypeKey]="selectedPaceTypeKey()"
            (typeSelected)="selectedPaceTypeKey.set($event)"
          />
        </div>
      }
    }
  }
}
<app-calendar-like-build />
<app-training-load-section />
<app-race-day-form-section />
<app-wellness-section />
<app-vo2max-section />
<app-marathon-pace-section />
<app-build-calendar-section />
